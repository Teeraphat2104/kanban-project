services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_URL=http://kong:8000
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - kanban

  supabase-db:
    image: supabase/postgres:17.6.1.136
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      kanban:
        aliases:
          - db

  supabase-auth:
    image: supabase/gotrue:v2.189.0
    ports:
      - "9999:9999"
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: "INFO"
      PORT: "9999"
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kanban

  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: "postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/postgres"
      PGRST_DB_SCHEMAS: "public,storage,graphql_public"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: "http://localhost:3000"
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kanban

  supabase-realtime:
    image: supabase/realtime:v2.102.3
    ports:
      - "4000:4000"
    environment:
      DB_HOST: supabase-db
      DB_PORT: "5432"
      DB_USER: "supabase_admin"
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: "postgres"
      DB_AFTER_CONNECT_QUERY: "SET session_preload_libraries = 'supabase_vault'"
      DB_ENC_KEY: "supabaserealtime"
      JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      REPLICATION_MODE: "stream"
      REPLICATION_POLL_INTERVAL: "100"
      SECURE_CHANNELS: "false"
      SLOT_NAME: "supabase_realtime_replication_slot"
      TEMPORARY_SLOT: "true"
      PORT: "4000"
      METRICS_JWT_SECRET: ${JWT_SECRET}
      APP_NAME: "supabase-realtime"
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kanban

  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    ports:
      - "5555:8080"
    environment:
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: "postgres"
      PG_META_DB_USER: "postgres"
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kanban

  supabase-studio:
    image: supabase/studio:2026.07.07-sha-a6a04f2
    ports:
      - "8080:3000"
    environment:
      STUDIO_PG_META_URL: "http://supabase-meta:8080"
      SUPABASE_URL: "http://localhost:8000"
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - ./volumes/snippets:/app/snippets
      - ./volumes/functions:/app/edge-functions:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://'+require('os').hostname()+':3000', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - supabase-meta
    restart: unless-stopped
    networks:
      - kanban

  kong:
    image: kong/kong:3.9.1
    ports:
      - "8000:8000"
    environment:
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_DATABASE: "off"
    volumes:
      - ./docker/kong/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kanban

volumes:
  db-data:

networks:
  kanban:
    driver: bridge
