_format_version: "3.0"
_transform: true

services:
  - name: auth
    url: http://supabase-auth:9999
    routes:
      - name: auth-all
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest
    url: http://supabase-rest:3000
    routes:
      - name: rest-all
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  - name: realtime
    url: http://supabase-realtime:4000
    routes:
      - name: realtime-all
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  - name: meta
    url: http://supabase-meta:8080
    routes:
      - name: meta-all
        paths:
          - /pg/
    plugins:
      - name: cors
